<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#553722">
    <title>프렙 카페 운영 기록</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app.mjs"></script>
  </head>
  <body>
    <div class="notice">프렙 카페 샘플 자료와 이 브라우저에 저장한 작업 기록을 보여줍니다.</div>
    <header class="app-header">
      <div class="brand-row">
        <a class="brand" href="#" data-page-link="daily"><span class="brand-mark">◒</span><span>프렙 카페 <small>운영 기록</small></span></a>
        <div class="header-meta"><span class="dot"></span><span id="as-of-label">샘플 기준일 확인 중</span><span class="local-save">이 브라우저에 저장</span></div>
        <button class="button primary mobile-add" data-action="new-sale">＋ 판매 기록</button>
      </div>
      <nav class="tabs" aria-label="주요 메뉴">
        <button class="tab active" data-page-link="daily">일일 기록</button>
        <button class="tab" data-page-link="performance">실적·메뉴 수익성</button>
        <button class="tab" data-page-link="profit">기간별 손익</button>
        <button class="tab" data-page-link="inventory">재료 잔량·재고</button>
      </nav>
    </header>
    <main id="app-main" class="page-shell" aria-live="polite">
      <div class="loading-card">샘플 자료를 불러오고 있습니다…</div>
    </main>
    <footer class="app-footer">
      <span>프렙 카페 운영 기록 · 금액은 부가세 제외 원화</span>
      <span>조회 결과는 기록 기준이며 공식 재무제표가 아닙니다.</span>
    </footer>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>
